services:
  db:
    image: postgres:17
    container_name: simtele_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simtele
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/infrastructure/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d simtele" ]
      interval: 5s
      retries: 10

  api:
    image: postgrest/postgrest:latest
    container_name: simtele_api
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/simtele
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_MAX_ROWS: 50000
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: simtele_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
